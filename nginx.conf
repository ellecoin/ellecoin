server {
    listen  80 default_server;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;
    root /usr/share/nginx/html;

    location / {
        proxy_set_header host $host;
        add_header X-Frame-Options SAMEORIGIN;
        try_files $uri /react/index.html;
    }

    location ~ ^/react/static/(js|css) {
        access_log off;
        expires max;
        proxy_set_header host $host;
        add_header Content-Encoding gzip;
        try_files $uri /react/index.html;
    }

    location ~ ^/(media|static) {
        root /data;
    }

    location ~ ^/uploads {
        root /data/media;
    }

    # get fear and greed from api.alternative.me
    location ~ ^/(en|pt|es|vi)/api/fng {
        rewrite ^/(en|pt|es|vi)/api/(.*) /$2 break;
        proxy_set_header host api.alternative.me;
        proxy_pass      https://api.alternative.me;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}