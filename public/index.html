    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />

      name="description"

    />

    <!--
	manifest.json provides metadata used when your web app is installed on a
	user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
  -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
	Notice the use of %PUBLIC_URL% in the tags above.
	It will be replaced with the URL of the `public` folder during the build.
	Only files inside the `public` folder can be referenced from the HTML.

	Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
	work correctly both with client-side routing and a non-root public URL.
	Learn how to configure a non-root public URL by running `npm run build`.
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>ElleCoin Trading Platform</title>
    <meta name="title" content="ElleCoin Trading Platform" />
    <meta
      name="description"
      content="Elevate Your Trades, Empower Your Strategy"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ElleCoin Trading Platform" />
    <meta
      property="og:description"
      content="Elevate Your Trades, Empower Your Strategy"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ElleCoin Trading Platform" />
    <meta
      property="twitter:description"
      content="Elevate Your Trades, Empower Your Strategy"
    />
    <!-- Meta Tags Generated with https://metatags.io -->

    />
